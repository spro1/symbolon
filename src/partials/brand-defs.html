<!-- 브랜드 심볼 일러스트 정의(페이지마다 한 번). 도형은 브랜드 심볼과 같은 좌표(48 단위)다.
     왼쪽 = Symbolon ID 색, 오른쪽 = Symbolon Gateway 색. 그라데이션과 빛나는 이음매는 일러스트에만 쓴다.
     로고 자리에는 이 정의가 아니라 static/brand/의 로고 파일을 쓴다(partials/brand-logo.html). -->
<svg class="svg-defs" aria-hidden="true" focusable="false">
  <defs>
    <linearGradient id="gBrass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6dca4"/>
      <stop offset="0.5" stop-color="#e3b768"/>
      <stop offset="1" stop-color="#a87628"/>
    </linearGradient>
    <linearGradient id="gMint" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bff8f0"/>
      <stop offset="0.5" stop-color="#5fe0d2"/>
      <stop offset="1" stop-color="#1c9d91"/>
    </linearGradient>
    <filter id="seamBlur" x="-50%" y="-20%" width="200%" height="140%"><feGaussianBlur stdDeviation="1.6"/></filter>
    <path id="pieceL" d="M21 0.188A24 24 0 0 0 21 47.812L21 33.918L30.068 24L21 14.082Z"/>
    <path id="pieceR" d="M24 0A24 24 0 0 1 24 48L24 35.082L34.132 24L24 12.918Z"/>
    <path id="seam" d="M22.5 -2 L22.5 13.5 L32.1 24 L22.5 34.5 L22.5 50"/>
  </defs>
  <!-- 심볼 전체 -->
  <symbol id="mark" viewBox="-6 -6 60 60">
    <use href="#seam" fill="none" stroke="#5fe0d2" stroke-width="3.2" stroke-linejoin="round" filter="url(#seamBlur)" opacity="0.85"/>
    <use href="#pieceL" fill="url(#gBrass)"/>
    <use href="#pieceR" fill="url(#gMint)"/>
    <use href="#seam" fill="none" stroke="#b9fff4" stroke-width="0.35" stroke-linejoin="round" opacity="0.9"/>
  </symbol>
  <!-- 좌우가 떨어진 심볼 -->
  <symbol id="mark-apart" viewBox="-14 -6 76 60">
    <g transform="translate(-6 2) rotate(-6 12 24)"><use href="#pieceL" fill="url(#gBrass)" opacity="0.9"/></g>
    <g transform="translate(6 -2) rotate(5 36 24)"><use href="#pieceR" fill="url(#gMint)" opacity="0.9"/></g>
  </symbol>
  <symbol id="half-id" viewBox="-2 -2 52 52"><use href="#pieceL" fill="url(#gBrass)"/></symbol>
  <symbol id="half-gw" viewBox="-2 -2 52 52"><use href="#pieceR" fill="url(#gMint)"/></symbol>
  <!-- 로고와 같은 평면 심볼(작은 자리용, 그라데이션 없음) -->
  <symbol id="symbol" viewBox="0 0 48 48"><use href="#pieceL" fill="#e3b768"/><use href="#pieceR" fill="#5fe0d2"/></symbol>
  <!-- 열쇠 날 하나(구분선·글머리) -->
  <symbol id="ward" viewBox="0 0 12 24"><path d="M2 1 L10 12 L2 23" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/></symbol>
</svg>
